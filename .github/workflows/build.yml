name: Build & Deploy APK

on:
  push:
    branches: [ main, master, old-phone ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (for sdkmanager / Android SDK setup)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Set up JDK 11 (for Gradle / AGP 7.2)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Prepare release keystore (custom cert, not androiddebugkey)
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/debug.keystore -alias jiekua \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jiekua2026 -keypass jiekua2026 \
            -dname "CN=JieKua Assistant, OU=Mobile, O=JieKua, L=Shenzhen, C=CN"
          printf 'keyAlias=jiekua\nkeyPassword=jiekua2026\nstorePassword=jiekua2026\nstoreFile=../keystore/debug.keystore\n' > keystore/keystore.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PisNeedPackage=false -Dorg.gradle.jvmargs=-Xmx4g --no-daemon

      - name: Stage APK
        run: |
          apk=$(find . -name '*universal*debug.apk' | head -1)
          [ -z "$apk" ] && apk=$(find . -name '*debug.apk' | head -1)
          echo "apk=$apk"
          cp "$apk" jiekua-zhushou-phone.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiekua-zhushou-phone-apk
          path: jiekua-zhushou-phone.apk

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy APK to server
        env:
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sshpass -p "$SERVER_PASS" rsync -az -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            jiekua-zhushou-phone.apk root@101.200.227.227:/opt/sms-server/server/static/jiekua-zhushou-phone.apk
