name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (for sdkmanager / Android SDK setup)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Set up JDK 11 (for Gradle / AGP 7.2)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Prepare release keystore (custom cert, not androiddebugkey)
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/debug.keystore -alias jiekua \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jiekua2026 -keypass jiekua2026 \
            -dname "CN=JieKua Assistant, OU=Mobile, O=JieKua, L=Shenzhen, C=CN"
          printf 'keyAlias=jiekua\nkeyPassword=jiekua2026\nstorePassword=jiekua2026\nstoreFile=../keystore/debug.keystore\n' > keystore/keystore.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PisNeedPackage=false -Dorg.gradle.jvmargs=-Xmx4g --no-daemon

      - name: Package APK as zip (avoids browser .apk risk warning)
        run: |
          apk=$(find . -name '*universal*debug.apk' | head -1)
          [ -z "$apk" ] && apk=$(find . -name '*debug.apk' | head -1)
          echo "apk=$apk"
          cp "$apk" jiekua-zhushou.apk
          zip -j jiekua-zhushou.zip jiekua-zhushou.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jiekua-zhushou
          path: |
            jiekua-zhushou.zip
            jiekua-zhushou.apk
