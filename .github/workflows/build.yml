name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Prepare debug keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug"
          printf 'keyAlias=androiddebugkey\nkeyPassword=android\nstorePassword=android\nstoreFile=keystore/debug.keystore\n' > keystore/keystore.properties

      - name: Build debug APK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          chmod +x gradlew
          ./gradlew assembleDebug -PisNeedPackage=false -Dorg.gradle.jvmargs=-Xmx4g --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jiekua-zhushou-debug
          path: '**/*.apk'
